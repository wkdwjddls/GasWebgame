<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="mockupTitle">
  <title id="mockupTitle">가스안전 교육 게임 목업 이미지</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182449"/>
      <stop offset="100%" stop-color="#0c1330"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="55%" stop-color="#ffb200"/>
      <stop offset="100%" stop-color="#fff2b0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="420" rx="28" fill="url(#bgGrad)"/>

  <!-- caution stripe footer -->
  <g opacity="0.9">
    <clipPath id="stripeClip"><rect x="0" y="384" width="640" height="36" rx="0"/></clipPath>
    <g clip-path="url(#stripeClip)">
      <rect x="0" y="384" width="640" height="36" fill="#ffb703"/>
      <g fill="#14183a">
        <polygon points="-20,420 10,384 40,384 10,420"/>
        <polygon points="30,420 60,384 90,384 60,420"/>
        <polygon points="80,420 110,384 140,384 110,420"/>
        <polygon points="130,420 160,384 190,384 160,420"/>
        <polygon points="180,420 210,384 240,384 210,420"/>
        <polygon points="230,420 260,384 290,384 260,420"/>
        <polygon points="280,420 310,384 340,384 310,420"/>
        <polygon points="330,420 360,384 390,384 360,420"/>
        <polygon points="380,420 410,384 440,384 410,420"/>
        <polygon points="430,420 460,384 490,384 460,420"/>
        <polygon points="480,420 510,384 540,384 510,420"/>
        <polygon points="530,420 560,384 590,384 560,420"/>
        <polygon points="580,420 610,384 640,384 610,420"/>
        <polygon points="630,420 660,384 690,384 660,420"/>
      </g>
    </g>
  </g>

  <!-- room wall + floor -->
  <rect x="40" y="60" width="560" height="300" rx="14" fill="#1f2c58" opacity="0.6"/>
  <rect x="40" y="300" width="560" height="60" fill="#141d3f" opacity="0.8"/>

  <!-- gas range (kitchen stove) -->
  <g transform="translate(70,220)">
    <rect x="0" y="40" width="150" height="60" rx="8" fill="#2c3968"/>
    <rect x="0" y="40" width="150" height="10" rx="4" fill="#3c4a86"/>
    <circle cx="40" cy="70" r="16" fill="#0f1730"/>
    <circle cx="110" cy="70" r="16" fill="#0f1730"/>
    <!-- flame on left burner -->
    <path d="M40 62 C 34 52, 46 48, 40 38 C 52 44, 50 56, 46 60 C 50 58, 52 52, 52 52 C 56 60, 50 68, 40 62 Z" fill="url(#flameGrad)"/>
    <circle cx="40" cy="55" r="26" fill="url(#glow)"/>
  </g>

  <!-- gas pipe line to cylinder -->
  <path d="M 150 250 H 300" stroke="#6f83c9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="250" r="7" fill="#a9b8ec"/>

  <!-- gas cylinder -->
  <g transform="translate(320,150)">
    <rect x="0" y="20" width="70" height="130" rx="16" fill="#3a4a8a"/>
    <rect x="10" y="0" width="50" height="24" rx="8" fill="#5064ab"/>
    <rect x="24" y="-14" width="22" height="16" rx="4" fill="#7688cf"/>
    <!-- valve wheel -->
    <circle cx="35" cy="-26" r="12" fill="none" stroke="#ffb703" stroke-width="4"/>
    <line x1="35" y1="-34" x2="35" y2="-18" stroke="#ffb703" stroke-width="4"/>
    <line x1="27" y1="-26" x2="43" y2="-26" stroke="#ffb703" stroke-width="4"/>
    <rect x="8" y="55" width="54" height="10" rx="4" fill="#28336a"/>
    <rect x="8" y="90" width="54" height="10" rx="4" fill="#28336a"/>
  </g>

  <!-- caution triangle above cylinder -->
  <g transform="translate(325,60)">
    <polygon points="30,0 60,54 0,54" fill="#ffb703"/>
    <polygon points="30,10 52,48 8,48" fill="#182449"/>
    <rect x="27" y="20" width="6" height="16" rx="3" fill="#ffb703"/>
    <circle cx="30" cy="42" r="3.2" fill="#ffb703"/>
  </g>

  <!-- detector / alarm on wall -->
  <g transform="translate(460,110)">
    <rect x="0" y="0" width="54" height="34" rx="8" fill="#e94f4f"/>
    <circle cx="27" cy="17" r="8" fill="#ffe3e3"/>
    <circle cx="27" cy="17" r="3.5" fill="#e94f4f"/>
    <path d="M 4 -6 A 30 30 0 0 1 50 -6" stroke="#ffb703" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M -6 -16 A 42 42 0 0 1 60 -16" stroke="#ffb703" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- inspector character with checklist -->
  <g transform="translate(470,220)">
    <circle cx="30" cy="18" r="18" fill="#ffd9a8"/>
    <path d="M12 12 a18 14 0 0 1 36 0 z" fill="#2c3968"/>
    <rect x="8" y="36" width="44" height="58" rx="14" fill="#3c8ce0"/>
    <rect x="-6" y="42" width="20" height="10" rx="5" fill="#ffd9a8"/>
    <!-- clipboard -->
    <rect x="46" y="40" width="30" height="40" rx="4" fill="#f4f6ff"/>
    <rect x="52" y="34" width="18" height="10" rx="3" fill="#c7cff0"/>
    <line x1="52" y1="54" x2="70" y2="54" stroke="#8b98cf" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="62" x2="70" y2="62" stroke="#8b98cf" stroke-width="3" stroke-linecap="round"/>
    <path d="M54 71 l5 5 l10 -11" stroke="#33b26a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- magnifier over pipe joint (inspection focus) -->
  <g transform="translate(255,270)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#4cc9f0" stroke-width="5"/>
    <line x1="16" y1="16" x2="34" y2="34" stroke="#4cc9f0" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
